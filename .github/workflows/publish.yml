name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.40.0
      - run: bun install --frozen-lockfile
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun -e 'if (process.env.RELEASE_TAG !== `v${(await Bun.file("package.json").json()).version}`) throw new Error("Release tag must match package version")'
      - run: bun run check
      - run: bun run test:package
      - name: Check whether this version is already published
        id: registry
        run: |
          if npm view "shuvcode-vcs-status@$(node -p 'require("./package.json").version')" version; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance --ignore-scripts
